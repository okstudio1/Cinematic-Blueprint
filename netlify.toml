[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/"
  to = "/cinematic-blueprint.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    # script-src still needs 'unsafe-inline': the app is a single file with an
    # inline <script> block and inline onclick handlers. The context menus no
    # longer build handlers from data, but the remaining inline attributes must
    # go before this can be tightened to a nonce.
    # connect-src covers Firebase Auth, Firestore (incl. its long-poll host) and
    # Google Analytics; img-src allows the data: URLs used for pasted shot images.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.google-analytics.com; frame-src https://*.firebaseapp.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
